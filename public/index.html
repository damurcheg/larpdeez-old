<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" id="metaThemeColor" />
  <title>Моя платформа обучения</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2'%3E%3Cpath d='M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body class="theme-light">
  <!-- Auth screen -->
  <div id="authScreen" class="auth-screen hidden">
    <form id="loginForm" class="login-card" autocomplete="off">
      <div class="login-logo"><i data-lucide="graduation-cap"></i></div>
      <h1 class="login-title">Личная платформа обучения</h1>
      <p class="login-subtitle">Введите пароль, чтобы продолжить</p>
      <div class="field">
        <label class="field-label" for="loginPassword">Пароль</label>
        <div class="input-wrap">
          <input id="loginPassword" type="password" class="input" placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" class="btn-icon input-toggle" id="toggleLoginPass" tabindex="-1" aria-label="Показать пароль"><i data-lucide="eye"></i></button>
        </div>
      </div>
      <div id="loginError" class="form-error hidden"></div>
      <button type="submit" class="btn btn-primary btn-block" id="loginSubmit">
        <span class="btn-label">Войти</span>
      </button>
    </form>
  </div>

  <!-- App shell -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/" aria-label="На главную">
          <span class="brand-icon"><i data-lucide="graduation-cap"></i></span>
          <span class="brand-name">Моя платформа</span>
        </a>
        <nav class="topnav" id="topNav">
          <a class="topnav-link" href="#/" data-nav="courses"><i data-lucide="library"></i><span>Курсы</span></a>
          <a class="topnav-link" href="#/calendar" data-nav="calendar"><i data-lucide="calendar-days"></i><span>Календарь</span></a>
          <a class="topnav-link" href="#/settings" data-nav="settings"><i data-lucide="settings"></i><span>Настройки</span></a>
        </nav>
        <div class="topbar-right">
          <button class="btn-icon" id="themeToggle" title="Переключить тему" aria-label="Переключить тему"><i data-lucide="moon"></i></button>
          <button class="user-chip" id="userChip" aria-label="Профиль">
            <span class="avatar avatar-sm" id="chipAvatar"></span>
            <span class="user-chip-name" id="chipName"></span>
          </button>
        </div>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>

  <!-- Overlays -->
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="menuRoot"></div>

  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/date-picker.js"></script>
  <script src="/js/calendar.js"></script>
  <script src="/js/planner.js"></script>
  <script src="/js/profile.js"></script>
  <script src="/js/course-view.js"></script>
  <script src="/js/editors.js"></script>
  <script src="/js/pages.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
